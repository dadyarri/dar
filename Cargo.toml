[package]
name = "dari"
version = "6.0.0"
edition = "2024"
authors = ["dadyarri <me@dadyarri.ru>"]
description = "Archiver that combines multiple compression algorithms with some useful utilities, like respecting gitignore files"

[dependencies]
eyre = "0.6.12"
clap = { version = "4.5.60", features = ["cargo"] }
bytemuck = "1.25.0"
ignore = "0.4.25"
blake3 = "1.8.3"
brotli = "8.0.2"
zstd = "0.13.3"
xz2 = "0.1.7"
oxipng = { version = "10.1.0", default-features = false }
chacha20poly1305 = { version = "0.10.1", default-features = false, features = ["std"] }
kamadak-exif = "0.6.1"
lofty = { version = "0.23.3", default-features = true }
rayon = "1"
rust-i18n = "3.1.5"
sys-locale = "0.3"
color-print = "0.3.7"
rpassword = "7.3.1"
ratatui = "0.29"
crossterm = "0.28"
nucleo-matcher = "0.3"
unicode-width = "0.2"
encoding_rs = "0.8"
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy"] }
clap_complete = "4.5.66"
serde_json = "1"
time = { version = "0.3", features = ["parsing", "formatting"] }

[target.'cfg(unix)'.dependencies]
xattr = "1"

[build-dependencies]
rust-i18n = "3.1.5"
toml = "0.9"
regex = "1"

[dev-dependencies]
tempfile = "3"
criterion = { version = "0.8.2", features = ["html_reports"] }

[[bench]]
name = "compression"
harness = false

[[bench]]
name = "reader"
harness = false

[[bench]]
name = "search"
harness = false
