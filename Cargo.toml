[package]
name = "dari"
version = "5.0.0"
edition = "2024"
authors = ["dadyarri <me@dadyarri.ru>"]
description = "Archiver that combines multiple compression algorithms with some useful utilities, like respecting gitignore files"

[dependencies]
eyre = "0.6.12"
clap = { version = "4.5.60", features = ["cargo"] }
bytemuck = "1.25.0"
ignore = "0.4.25"
blake3 = "1.8.3"
brotli = "8.0.2"
zstd = "0.13.3"
xz2 = "0.1.7"
oxipng = { version = "10.1.0", default-features = false }
lepton_jpeg = "0.5.8"
chacha20poly1305 = { version = "0.10.1", default-features = false, features = ["std"] }
kamadak-exif = "0.6.1"
lofty = { version = "0.23.3", default-features = true }
rust-i18n = "3.1.5"
sys-locale = "0.3"
color-print = "0.3.7"
rpassword = "7.3.1"
ratatui = "0.29"
crossterm = "0.28"
nucleo-matcher = "0.3"
unicode-width = "0.2"

[build-dependencies]
clap = { version = "4.5.60", features = ["cargo"] }
clap_complete = "4.5.66"
rust-i18n = "3.1.5"
toml = "0.9"
regex = "1"
color-print = "0.3.7"

[dev-dependencies]
tempfile = "3"
