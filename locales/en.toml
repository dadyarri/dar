_version = 1

[cli]
about = "Archiver that combines multiple compression algorithms with useful utilities"

[cli.prompts]
enter_passphrase = "Enter encryption passphrase: "

[cli.common.args]
verbose = "Enables verbose output"
content = "Files/folders to add to archive"
help = "Shows help of the command"
version = "Shows version information"

[cli.common.headings]
usage = "Usage"
commands = "Commands"
arguments = "Arguments"
options = "Options"

[cli.common.errors]
