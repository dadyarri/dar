index_entry_write_failed = "Failed to write index entry"
entry_path_write_failed = "Failed to write entry path"
entry_extra_write_failed = "Failed to write entry extra"
footer_write_failed = "Failed to write archive footer"
flush_archive_failed = "Failed to flush archive"
brotli_compression_failed = "Brotli compression error: %{error}"
zstd_compression_failed = "ZStandard compression error: %{error}"
invalid_compression_method = "Invalid value for CompressionMethod: %{value}"
time_before_unix_epoch = "Time is set before Unix Epoch"
encrypt_prompt_failed = "Failed to read passphrase from the terminal"
encrypt_prompt_empty = "Passphrase cannot be empty"
read_failed = "Failed to read archive %{file}"
seek_failed = "Failed to seek within archive %{file}"
header_read_failed = "Failed to read archive header for %{file}"
header_invalid = "Archive header is invalid or unsupported version"
footer_read_failed = "Failed to read archive footer for %{file}"
