[cli.create]
about = "Creates new archive"

[cli.create.args]
file = "The path to the resulting archive file"
overwrite = "Overwrite existing archive file"
compress_images = "Losslessly optimize PNG/JPEG using image-specific codecs"
encrypt = "Prompt for passphrase interactively to encrypt file data"
encrypt_passphrase = "Encrypt file data using the provided passphrase argument"
passphrase_value = "PASSPHRASE"

[cli.create.messages]
creating_archive = "Creating archive %{file}"

[cli.create.errors]
file_exists = "File %{file} already exists"
delete_failed = "Failed to delete file"
create_file_failed = "Failed to create file"
create_archive_failed = "Failed to create archive"

[cli.append]
about = "Appends data to existing archive"

[cli.append.args]
file = "The path to the existing archive file"
compress_images = "Losslessly optimize PNG/JPEG using image-specific codecs"
encrypt = "Prompt for passphrase interactively to encrypt appended file data"
encrypt_passphrase = "Encrypt appended file data using the provided passphrase argument"

[cli.append.messages]
appending_archive = "Appending into archive %{file}"

[cli.append.errors]
append_failed = "Failed to append to archive"
append_file_missing = "Archive file %{file} does not exist"
append_open_failed = "Failed to open archive %{file} for appending"
append_truncate_failed = "Failed to truncate archive %{file} before rewriting the index"
append_seek_failed = "Failed to seek within archive %{file}"
append_read_failed = "Failed to read archive %{file}"
append_header_read_failed = "Failed to read archive header for %{file}"
append_header_invalid = "Archive header is invalid"
append_footer_read_failed = "Failed to read archive footer for %{file}"
append_footer_invalid = "Archive footer is invalid"
append_index_decode_failed = "Failed to decode archive index entries"
